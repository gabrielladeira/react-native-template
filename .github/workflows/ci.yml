name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Sensores computacionais
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Instalar OpenSpec
        run: npm install -g @fission-ai/openspec@latest

      # Cada passo é um sensor independente: `continue-on-error: false` de propósito,
      # mas com `if: always()` para o PR mostrar TODAS as falhas de uma vez em vez de
      # uma por push. Menos ciclos de correção para humano e agente.
      - name: Tipos
        if: always()
        run: npm run typecheck

      - name: Lint e fronteiras de camada
        if: always()
        run: npm run lint

      - name: Fitness de arquitetura
        if: always()
        run: npm run arch

      # No CI a ausência do CLI é erro, não aviso — aqui ele é instalado de propósito.
      - name: Validação das specs
        if: always()
        env:
          OPENSPEC_REQUIRED: '1'
          OPENSPEC_TELEMETRY: '0'
        run: npm run spec

      - name: Testes
        if: always()
        run: npm run test -- --coverage --ci

      - name: Formatação
        if: always()
        run: npm run format:check

  drift:
    name: Sensores de drift (não bloqueiam)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Código morto
        run: npm run deadcode
      - name: Saúde do setup Expo
        run: npx expo-doctor@latest
